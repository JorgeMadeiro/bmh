<!-- BMH · /drjorge/ (15/10/2026, bastão da Nexo): destino do link "Hiperbárica (BMH)" da bio do Instagram do Dr. Jorge.
     Abre o WhatsApp da BMH com a frase pronta, que é o marcador de origem ("Vim pelo Instagram do Dr. Jorge"). Página curta

<style>
