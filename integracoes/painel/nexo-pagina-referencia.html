<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anúncios · NEXO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F3F6F4;--card:#FFFFFF;--ink:#3B3F3D;--strong:#1F2422;--muted:#68706C;--line:#DFE6E2;--soft:#EDF2EF;
  --verde:#008B47;--verde-2:#2EA55C;--verde-soft:#E1F3E8;--lima:#8DBF44;
  --google:#2C5F8A;--google-soft:#E4EEF6;--meta:#008B47;--organico:#6B4FA3;--organico-soft:#EEE8F7;
  --bom:#1E8E4E;--bom-soft:#E1F3E8;--alerta:#B86E12;--alerta-soft:#FBF0DF;--ruim:#B0432F;--ruim-soft:#F9E8E4;
  --sombra:0 2px 10px rgba(31,36,34,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131715;--card:#1C2220;--ink:#D5DCD8;--strong:#F3F6F4;--muted:#9AA59F;--line:#2C3430;--soft:#242B27;
  --verde:#3DB86C;--verde-2:#46B872;--verde-soft:#193325;--lima:#A3CF5E;
  --google:#7FB0DD;--google-soft:#1C2A36;--meta:#3DB86C;--organico:#B7A2E0;--organico-soft:#28213A;
  --bom:#4CC27A;--bom-soft:#193325;--alerta:#E0A04A;--alerta-soft:#35291A;--ruim:#E58472;--ruim-soft:#3A221D;--sombra:none}}
:root[data-theme="dark"]{
  --bg:#131715;--card:#1C2220;--ink:#D5DCD8;--strong:#F3F6F4;--muted:#9AA59F;--line:#2C3430;--soft:#242B27;
  --verde:#3DB86C;--verde-2:#46B872;--verde-soft:#193325;--lima:#A3CF5E;
  --google:#7FB0DD;--google-soft:#1C2A36;--meta:#3DB86C;--organico:#B7A2E0;--organico-soft:#28213A;
  --bom:#4CC27A;--bom-soft:#193325;--alerta:#E0A04A;--alerta-soft:#35291A;--ruim:#E58472;--ruim-soft:#3A221D;--sombra:none}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px 56px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:24px;min-width:0}
h1,h2,h3{font-family:"Montserrat",system-ui,sans-serif;color:var(--strong);margin:0;text-wrap:balance}
h1{font-size:clamp(24px,4.5vw,30px);font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(18px,3.6vw,21px);font-weight:700}
.sub{color:var(--muted);font-size:14.5px}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--verde);outline-offset:2px}
.topo{display:flex;align-items:center;gap:14px}
.topo i{flex:none;width:12px;height:40px;border-radius:4px;background:linear-gradient(var(--verde) 0 55%,var(--lima) 55% 100%)}
.topo .sub{margin-top:2px}
.filtros{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sombra);min-width:0}
.linha{display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;min-width:0;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 16px;font-size:15px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--verde);border-color:var(--verde);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--card);padding:9px 15px;font-size:15px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--strong);color:var(--bg)}
select,input[type=date]{font:inherit;font-size:16px;color:var(--strong);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-height:44px;max-width:100%;min-width:0}
#campanha{flex:1 1 260px;width:100%}
#conta{flex:0 1 240px}
details.datas summary{cursor:pointer;color:var(--verde);font-weight:600;font-size:15px;list-style:none}
details.datas summary::-webkit-details-marker{display:none}
details.datas[open] summary{margin-bottom:10px}
.datas .linha label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1 1 150px}
/* Resumo em palavras */
.resumo{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 22px;box-shadow:var(--sombra);font-size:17px;line-height:1.6;color:var(--strong)}
.resumo b{color:var(--verde)}
.resumo .sub{margin-top:6px;font-size:14.5px}
/* Destaque */
.destaque{background:var(--verde-soft);border:1px solid var(--verde);border-radius:24px;padding:24px 26px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 28px;align-items:center}
.destaque .rot{font-size:15px;font-weight:600;color:var(--verde)}
.destaque .val{font-family:"Montserrat",sans-serif;font-weight:800;font-size:clamp(40px,9vw,58px);line-height:1.05;color:var(--strong);font-variant-numeric:tabular-nums;margin:4px 0 8px}
.destaque .val small{font-size:.42em;font-weight:700;color:var(--muted);margin-left:6px}
.destaque p{margin:0;font-size:16.5px;color:var(--ink);max-width:58ch}
.destaque p+p{margin-top:8px;font-size:14.5px;color:var(--muted)}
.plats{display:flex;flex-direction:column;gap:8px;min-width:230px}
.plat{background:var(--card);border-radius:16px;padding:11px 16px;display:flex;justify-content:space-between;gap:14px;align-items:baseline}
.plat b{font-family:"Montserrat",sans-serif;font-size:20px;color:var(--strong);font-variant-numeric:tabular-nums}
.plat span{font-size:14px;color:var(--muted)}
.plat em{font-style:normal;font-weight:700;font-size:13px;letter-spacing:.02em}
.destaque{grid-template-columns:minmax(0,1fr) minmax(240px,380px)}
@media (max-width:720px){.destaque{grid-template-columns:1fr}}
.plat{flex-wrap:wrap}.plat-nota{flex-basis:100%;font-size:12.5px;color:var(--muted);line-height:1.35}
@media (max-width:720px){.destaque{grid-template-columns:1fr;padding:20px}.plats{min-width:0}}
.grupo{display:flex;flex-direction:column;gap:12px}
.grupo .cab{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px}
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:820px){.nums{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.num{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--sombra);min-width:0;display:flex;flex-direction:column;gap:2px}
.num .rot{font-size:14.5px;font-weight:600;color:var(--muted)}
.num .val{font-family:"Montserrat",sans-serif;font-weight:800;font-size:clamp(24px,5.6vw,32px);color:var(--strong);line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.num .det{font-size:13.5px;color:var(--muted);line-height:1.35}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;border-radius:999px;padding:3px 9px;margin-top:6px;width:max-content;max-width:100%}
.delta.bom{background:var(--bom-soft);color:var(--bom)}
.delta.ruim{background:var(--ruim-soft);color:var(--ruim)}
.delta.igual{background:var(--soft);color:var(--muted)}
.avisos{display:flex;flex-direction:column;gap:8px}
.aviso{border-left:5px solid var(--alerta);background:var(--alerta-soft);border-radius:14px;padding:12px 16px;font-size:15px;color:var(--strong)}
.aviso.ruim{border-color:var(--ruim);background:var(--ruim-soft)}
.bloco{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--sombra)}
.bloco .cab{display:flex;justify-content:space-between;align-items:baseline;gap:6px 12px;flex-wrap:wrap}
.duas{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.duas{grid-template-columns:1fr}}
.tres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.tres{grid-template-columns:1fr}}
.tres .grafico{height:230px}
.duas .grafico{height:280px}
.duas h3{font-size:16px;font-weight:700}
.duas .sub{margin-top:-4px}
.tres h3{font-size:16px;font-weight:700}
.tres .sub{margin-top:-4px}
.grafico{position:relative;height:300px}
.grafico-utm{position:relative}
@media (max-width:720px){.grafico{height:240px}.bloco{padding:16px 14px}}
/* Métricas de tráfego por etapa da jornada */
.etapas-traf{display:flex;flex-direction:column;gap:12px}
.et-linha{display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px;align-items:stretch}
.et-rot{display:flex;gap:10px;align-items:center;padding:6px 4px}
.et-rot b{display:block;font-family:"Montserrat",sans-serif;color:var(--strong);font-size:15.5px;line-height:1.25}
.et-rot span:not(.et-n){display:block;font-size:13px;color:var(--muted);line-height:1.3}
.et-n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--verde-soft);color:var(--verde);font-weight:700;font-size:14px;display:grid;place-items:center}
@media (max-width:820px){.et-linha{grid-template-columns:1fr;gap:6px}}
/* Funil da jornada */
.jornadas{display:flex;flex-direction:column;gap:22px}
.jornada h3{font-size:15px;font-weight:700;margin-bottom:8px}
.jornada svg{display:block;width:100%;height:70px}
.jor-et{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:8px}
.jor-et div{display:flex;flex-direction:column;gap:1px;min-width:0}
.jor-et span{font-size:12.5px;color:var(--muted);font-weight:600}
.jor-et b{font-family:"Montserrat",sans-serif;font-size:19px;color:var(--strong);font-variant-numeric:tabular-nums;line-height:1.2}
.jor-et small{font-size:12px;color:var(--muted);line-height:1.3}
.jor-barra{display:none}
@media (max-width:720px){.jornada svg{display:none}.jor-et{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px}.jor-barra{display:block;height:8px;border-radius:4px;margin-bottom:6px;min-width:6px}.jor-et b{font-size:17px}}
.seg{max-width:100%;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}.seg button{white-space:nowrap}
@media (max-width:720px){.seg button{padding:9px 11px;font-size:14.5px}}
/* Agendamentos e atendimentos por origem */
.origem-linha{display:flex;flex-direction:column;gap:6px}
.origem-cab{display:flex;justify-content:space-between;font-size:15px}
.origem-cab span{font-variant-numeric:tabular-nums;font-weight:600;color:var(--strong)}
.origem-barra{display:flex;height:18px;border-radius:9px;overflow:hidden;background:var(--soft)}
.origem-barra i{display:block;height:100%}
.origem-leg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13.5px;color:var(--muted)}
.origem-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:0}
.origem-leg b{color:var(--strong);font-variant-numeric:tabular-nums}
.teto-p{margin-top:14px}
.teto-p .cab{display:flex;justify-content:space-between;font-size:15px}
.num-f{font-variant-numeric:tabular-nums;color:var(--strong)}
/* Mês e guardião */
.mes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.mes{grid-template-columns:1fr}}
.barra-mes{height:18px;background:var(--soft);border-radius:9px;overflow:hidden;position:relative;margin:8px 0 6px}
.barra-mes b{display:block;height:100%;border-radius:9px;background:var(--verde)}
.barra-mes i{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--strong);opacity:.5}
.mes .grande{font-family:"Montserrat",sans-serif;font-weight:800;font-size:clamp(26px,5vw,34px);color:var(--strong);font-variant-numeric:tabular-nums}
.mes .grande small{font-size:.5em;color:var(--muted);font-weight:600}
.acoes{display:flex;flex-direction:column;gap:8px}
.acao{display:flex;gap:10px;align-items:flex-start;font-size:15px;padding:10px 12px;border-radius:12px;background:var(--soft)}
.acao .q{flex:none;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px;min-width:46px}
.acao.aviso-g{background:var(--alerta-soft)}
.acao.falha{background:var(--ruim-soft)}
.selo{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--alerta-soft);color:var(--alerta)}
.selo.real{background:var(--bom-soft);color:var(--bom)}
table.calor{font-size:12.5px;border-collapse:separate;border-spacing:3px}
table.calor th{padding:2px 3px;border:0;cursor:default;font-size:11.5px;text-align:center}
table.calor th.txt{text-align:left;padding-right:6px}
table.calor td.cal{padding:0;border:0;height:28px;min-width:30px;text-align:center;border-radius:6px;font-variant-numeric:tabular-nums;font-size:11.5px;
  background:color-mix(in srgb, var(--verde) calc(var(--p) * 100%), var(--soft));color:var(--strong)}
.leitura h3{font-size:16px;font-weight:700}
.leitura ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.leitura li{padding:10px 14px 10px 16px;border-radius:12px;font-size:15px;line-height:1.5;border-left:5px solid var(--muted);background:var(--soft)}
.leitura li.bom{border-color:var(--bom);background:var(--bom-soft)}
.leitura li.atencao{border-color:var(--alerta);background:var(--alerta-soft)}
.leitura li.ruim{border-color:var(--ruim);background:var(--ruim-soft)}
.funil{display:flex;flex-direction:column;gap:18px}
.funil h3{font-size:16px;font-weight:700;margin-bottom:6px}
.etapa{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:15px;margin:5px 0}
.etapa .barra{height:16px;background:var(--soft);border-radius:6px;overflow:hidden}
.etapa .barra b{display:block;height:100%;border-radius:6px}
.etapa .n{font-variant-numeric:tabular-nums;color:var(--strong);font-weight:600;white-space:nowrap}
.etapa .n small{color:var(--muted);font-weight:400;margin-left:4px}
.opcoes{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.link{border:0;background:none;color:var(--verde);font-weight:600;padding:4px 0;font-size:15px}
.rolagem{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:13px;font-weight:600;color:var(--muted);text-align:right;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th.txt,td.txt{text-align:left}
td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.txt{white-space:normal;min-width:220px;color:var(--strong)}
td.forte{font-weight:700;color:var(--strong)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin-right:6px;vertical-align:1px}
.tag.google{background:var(--google-soft);color:var(--google)}
.tag.meta{background:var(--verde-soft);color:var(--verde)}
.tag.outros{background:var(--soft);color:var(--muted)}
.tag.organico{background:var(--organico-soft);color:var(--organico)}
a{color:var(--verde);text-decoration:none}
a:hover{text-decoration:underline}
.nulo{color:var(--muted)}
.sub.fino{font-size:13.5px}
th.detalhe,td.detalhe{display:none}
.mostra-detalhe th.detalhe,.mostra-detalhe td.detalhe{display:table-cell}
.cartoes{display:none;flex-direction:column;gap:10px}
.cartao{border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.cartao .nome{font-weight:600;color:var(--strong);line-height:1.35;overflow-wrap:anywhere}
.cartao .onde{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.cartao .met{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
.cartao .met div{display:flex;flex-direction:column}
.cartao .met span{font-size:13px;color:var(--muted)}
.cartao .met b{font-variant-numeric:tabular-nums;color:var(--strong);font-size:16px}
.cartao .met .forte b{color:var(--verde);font-family:"Montserrat",sans-serif;font-size:18px}
@media (max-width:720px){.lista table{display:none}.lista .cartoes{display:flex}.lista .rolagem{overflow:visible}.opcoes #ver-detalhes{display:none}}
.carregando{color:var(--muted);padding:40px 0;text-align:center}
details.como{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;font-size:14.5px;color:var(--muted)}
details.como summary{cursor:pointer;font-weight:600;color:var(--strong)}
details.como ul{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="topo"><i></i><div><h1>Anúncios da Nexo</h1><div class="sub" id="atualizado">carregando…</div></div></header>

  <section class="filtros" aria-label="Filtros">
    <div class="chips" id="atalhos" aria-label="Período">
      <button class="chip" data-p="7">7 dias</button><button class="chip" data-p="30">30 dias</button><button class="chip" data-p="mes">Este mês</button>
      <button class="chip" data-p="mespassado">Mês passado</button><button class="chip" data-p="90">90 dias</button>
    </div>
    <details class="datas" id="datas"><summary>Escolher datas</summary>
      <div class="linha"><label>De<input type="date" id="inicio"></label><label>Até<input type="date" id="fim"></label>
        <button class="chip" id="aplicar" style="align-self:flex-end">Ver este período</button></div>
    </details>
    <div class="linha">
      <select id="conta" aria-label="Conta ou médico"></select>
      <div class="seg" id="plataforma" aria-label="Plataforma"><button data-v="todas" aria-pressed="true">Todas</button><button data-v="pago" aria-pressed="false">Anúncios</button><button data-v="google" aria-pressed="false">Google</button><button data-v="meta" aria-pressed="false">Meta</button><button data-v="organico" aria-pressed="false">Orgânico</button></div>
      <select id="campanha" aria-label="Campanha"><option value="">Todas as campanhas</option></select>
    </div>
  </section>

  <div class="avisos" id="avisos"></div>
  <div id="conteudo"><div class="carregando">Buscando os dados do Google, do Meta, do Kommo e do iGut…</div></div>
</div>

<script>
const $ = id => document.getElementById(id);
const brl = v => v == null || !isFinite(v) ? '—' : 'R$ ' + v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const brl0 = v => v == null || !isFinite(v) ? '—' : 'R$ ' + Math.round(v).toLocaleString('pt-BR');
const int = v => v == null || !isFinite(v) ? '—' : Math.round(v).toLocaleString('pt-BR');
const pct = v => v == null || !isFinite(v) ? '—' : (v * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%';
const div = (a, b) => b ? a / b : null;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const iso = d => d.toISOString().slice(0, 10);
const br = s => s.split('-').reverse().join('/');
const brCurto = s => s.slice(8, 10) + '/' + s.slice(5, 7);
const cor = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const soma = (l, k) => l.reduce((s, x) => s + (Number(x[k]) || 0), 0);
const NOME_P = { google: 'Google', meta: 'Meta', organico: 'Orgânico', outros: 'Outros' };
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

// Os dados chegam dentro da página, já calculados pelo n8n. Período e conta recarregam a página.
const DADOS = /*__DADOS__*/null;
const E = { dados: null, plataforma: 'todas', campanha: '', conta: '', detalhes: false, todos: {}, utm: 'origem' };
const LIMITE = { camp: 6, ad: 8, utm: 6 };
const mais = (id, total, nome) => { const el = $('mais-' + id); if (!el) return; el.innerHTML = total > LIMITE[id] ? `<button class="link" id="btn-mais-${id}">${E.todos[id] ? 'Mostrar só as principais' : `Ver ${nome} (${total})`}</button>` : ''; const b = $('btn-mais-' + id); if (b) b.onclick = () => { E.todos[id] = !E.todos[id]; desenhar(); }; };
const ORDEM = {};
let graficos = [], graficoUtm = null;

function recarregar() {
  $('conteudo').innerHTML = '<div class="carregando">Buscando os dados…</div>';
  location.search = new URLSearchParams({ inicio: $('inicio').value, fim: $('fim').value, conta: E.conta, plataforma: E.plataforma, campanha: E.campanha }).toString();
}
function periodo(p) {
  const h = new Date(); h.setHours(12); h.setDate(h.getDate() - 1);   // até ontem: os anúncios são gravados uma vez por dia
  let a = new Date(h), b = new Date(h);
  if (p === 'mes') a = new Date(h.getFullYear(), h.getMonth(), 1, 12);
  else if (p === 'mespassado') { a = new Date(h.getFullYear(), h.getMonth() - 1, 1, 12); b = new Date(h.getFullYear(), h.getMonth(), 0, 12); }
  else a.setDate(h.getDate() - (Number(p) - 1));
  $('inicio').value = iso(a); $('fim').value = iso(b); recarregar();
}

function iniciar() {
  if (!DADOS || !DADOS.ok) { $('conteudo').innerHTML = '<div class="aviso ruim">Não consegui montar os dados agora. Atualize a página em alguns segundos.</div>'; return; }
  const d = E.dados = DADOS, url = new URLSearchParams(location.search);
  $('inicio').value = d.inicio; $('fim').value = d.fim; E.conta = d.conta?.id || '';
  for (const c of d.contas || []) $('conta').add(new Option(c.nome, c.id)); $('conta').value = E.conta;
  E.plataforma = ['todas', 'pago', 'google', 'meta', 'organico'].includes(url.get('plataforma')) ? url.get('plataforma') : 'todas';
  document.querySelectorAll('#plataforma button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.v === E.plataforma)));
  const hora = new Date(d.gerado_em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  $('atualizado').textContent = `${br(d.inicio)} a ${br(d.fim)}` + (d.anuncios_atualizado ? ` · anúncios gravados em ${d.anuncios_atualizado.slice(8, 10)}/${d.anuncios_atualizado.slice(5, 7)} às ${d.anuncios_atualizado.slice(11, 16)}` : ` · atualizado às ${hora}`);
  const camps = [...new Set(d.anuncios.concat(d.organico || []).map(a => a.p + '|' + a.camp))].sort();
  for (const c of camps) { const [p, n] = c.split('|'); $('campanha').add(new Option(NOME_P[p] + ' · ' + n, c)); }
  E.campanha = camps.includes(url.get('campanha')) ? url.get('campanha') : ''; $('campanha').value = E.campanha;
  desenhar();
}

// "Anúncios" = Google + Meta, só o tráfego pago (pedido do Jorge, 30/09/2026); "Todas" inclui o orgânico
const naPlat = p => E.plataforma === 'todas' || E.plataforma === p || (E.plataforma === 'pago' && (p === 'google' || p === 'meta'));
const filtra = l => (l || []).filter(a => naPlat(a.p) && (!E.campanha || a.p + '|' + a.camp === E.campanha));
// Seta de comparação só quando a fonte já tinha dado no começo do período anterior
const cobre = k => !E.dados.anterior || !E.dados.cobertura || !E.dados.cobertura[k] || E.dados.anterior.inicio >= E.dados.cobertura[k];
// Dias em que o resultado de anúncio foi medido: medição própria desde 25/09/2026; no Tintim (até 23/08) só Google e link do site
function medicao(ads, pagos) {
  const desde = E.dados.medido_desde || '2026-09-25', ok = x => x.d >= desde || (x.d <= '2026-08-23' && x.p !== 'meta');
  const p = pagos.filter(ok), gasto = soma(ads.filter(ok), 'gasto');
  return { ok, pagos: p, gasto, ag: p.filter(o => o.ag).length, cp: p.filter(o => o.cp).length, parcial: ads.some(a => !ok(a) && a.gasto > 0) };
}
// Comparação justa quando um dos períodos encosta nos dias sem medição (06/10/2026): conta só os dias medidos de cada
// período e põe o anterior na mesma quantidade de dias (antes, 2 dias da lacuna no anterior apagavam todas as setas)
function diasMedidos(ini, fim) { const desde = E.dados.medido_desde || '2026-09-25'; let n = 0, t = 0;
  for (let x = new Date(ini + 'T12:00:00Z'); x <= new Date(fim + 'T12:00:00Z'); x = new Date(x.getTime() + 864e5)) { const s = x.toISOString().slice(0, 10); t++; if (s >= desde || s <= '2026-08-23') n++; }
  return { n, t }; }
// null = sem seta (menos da metade dos dias medida em algum dos dois); f = fator que leva o anterior aos dias medidos de agora
function compMedida() { const a = E.dados.anterior; if (!a || !cobre('origem')) return null;
  const m = diasMedidos(E.dados.inicio, E.dados.fim), mA = diasMedidos(a.inicio, a.fim);
  if (!mA.n || m.n < m.t / 2 || mA.n < mA.t / 2) return null; return { f: m.n / mA.n, parcial: m.n < m.t || mA.n < mA.t }; }
const rotMedido = (s) => s;   // o ajuste pelos dias medidos continua no cálculo; o rótulo "dias medidos" saiu da seta (07/10/2026, Jorge)
const geralOrigem = g => { const z = { google: 0, meta: 0, organico: 0, sem: 0 }; const a = { ...z, ...(g?.agendou || {}) }, c = { ...z, ...(g?.compareceu || {}) };
  a.total = a.google + a.meta + a.organico + a.sem; c.total = c.google + c.meta + c.organico + c.sem; return { ag: a, cp: c }; };
// Barra empilhada por origem (agendamentos e atendimentos pela data em que aconteceram)
function blocoOrigens(G, GA) {
  if (!G.ag.total) return '';
  // Agendou por origem existe desde o webhook de 25/09/2026 (atendidos saíram em 06/10/2026: o bloco vai até o agendamento)
  const cob = E.dados.cobertura || {}, ini = E.dados.inicio, fim = E.dados.fim;
  const desde = (k, nome) => !cob[k] || ini >= cob[k] ? nome : fim < cob[k] ? null : `${nome} <small class="nulo">desde ${br(cob[k])}</small>`;
  const OR = [['google', 'Google Ads', '--google'], ['meta', 'Meta Ads', '--meta'], ['organico', 'Orgânico', '--organico'], ['sem', 'Sem origem marcada', '--muted']];
  const barra = (t, nome) => !nome ? '' : `<div class="origem-linha"><div class="origem-cab"><b>${nome}</b><span>${int(t.total)}</span></div>
    <div class="origem-barra">${OR.map(([k, , c]) => t[k] ? `<i style="width:${(t[k] / t.total * 100).toFixed(1)}%;background:var(${c})" title="${int(t[k])}"></i>` : '').join('')}</div>
    <div class="origem-leg">${OR.map(([k, n, c]) => `<span><i style="background:var(${c})"></i>${n} <b>${int(t[k])}</b>${t.total ? ` <small>${pct(t[k] / t.total)}</small>` : ''}</span>`).join('')}</div></div>`;
  return `<section class="bloco"><div class="cab"><h3>De onde vieram os agendamentos</h3><span class="sub fino">pela data em que aconteceram</span></div>
    ${barra(G.ag, desde('agendou', 'Agendaram'))}
    <div class="sub fino">A origem é a última marcada até 60 dias antes (anúncio, site, bio do Instagram, perfil do Google, formulário). "Sem origem marcada" é quem escreveu direto: já tinha o número, paciente antigo, indicação, ou apagou a mensagem pronta do anúncio. Os agendamentos aqui são os do funil Atendimento Comercial, por isso o total pode diferir um pouco do Kommo.</div></section>`;
}

// Comparação com o período anterior (mesmo tamanho). "menorMelhor" para custos.
function delta(atual, anterior, menorMelhor, fmt, neutro) {
  if (!E.dados.anterior || anterior == null || !isFinite(anterior) || !anterior) return '';
  const v = atual / anterior - 1; if (!isFinite(v)) return '';
  const cls = (neutro || Math.abs(v) < .03) ? 'igual' : ((v > 0) !== !!menorMelhor ? 'bom' : 'ruim');
  const seta = Math.abs(v) < .03 ? '=' : v > 0 ? '▲' : '▼';
  return `<span class="delta ${cls}" title="antes: ${fmt(anterior)}">${seta} ${Math.abs(v * 100).toLocaleString('pt-BR', { maximumFractionDigits: 0 })}% <span style="font-weight:400">vs. anterior</span></span>`;
}

function desenhar() {
  if (E.plataforma === 'organico') return desenharOrganico();
  const soPago = E.plataforma !== 'todas';
  const d = E.dados, ads = filtra(d.anuncios), ori = filtra(d.origens);
  const adsA = filtra(d.anuncios_ant), oriA = filtra(d.origens_ant);
  const PAGO = o => o.conv && o.p !== 'outros' && o.p !== 'organico';
  const pagos = ori.filter(PAGO), pagosA = oriA.filter(PAGO);
  const orgConv = !soPago ? ori.filter(o => o.conv && o.p === 'organico') : [];   // orgânico entra só como linha da tabela e frase do resumo
  // Contatos = conversas no Meta + cliques no WhatsApp do Google + ligações vindas do Google (30/09/2026: as ligações ficavam de fora)
  const lig = soma(ads, 'ligacoes'), ligA = soma(adsA, 'ligacoes');
  const gasto = soma(ads, 'gasto'), contatos = soma(ads, 'contatos') + lig;
  const gastoA = soma(adsA, 'gasto'), contatosA = soma(adsA, 'contatos') + ligA;
  const ag = pagos.filter(o => o.ag).length, cp = pagos.filter(o => o.cp).length;
  const agA = pagosA.filter(o => o.ag).length, cpA = pagosA.filter(o => o.cp).length;
  // Custo por agendamento e por atendido: só com o investimento dos dias em que o resultado foi medido (medição própria
  // desde 25/09/2026; no Tintim, até 23/08, só Google e link do site; a lacuna de 24/08 a 24/09 fica de fora).
  const M = medicao(ads, pagos), MA = medicao(adsA, pagosA);
  const k = d.kommo || { entraram: 0, agendados: 0, dias: [] }, kA = d.kommo_ant || null;
  // Por plataforma: todos os agendados; custo por agendamento só com os dias medidos (c = agendados medidos) · 06/10/2026, antes por atendido
  const porPlat = ['google', 'meta'].filter(naPlat).map(p => ({ p, g: soma(ads.filter(a => a.p === p && M.ok(a)), 'gasto'), total: pagos.filter(o => o.p === p && o.ag).length,
    c: M.pagos.filter(o => o.p === p && o.ag).length }));
  const orgAg = orgConv.filter(o => o.ag).length, orgCp = orgConv.filter(o => o.cp).length;
  const num = (r, v, dt, dl) => `<div class="num"><div class="rot">${r}</div><div class="val">${v}</div>${dt ? `<div class="det">${dt}</div>` : ''}${dl || ''}</div>`;
  const dias = Math.round((new Date(d.fim + 'T12:00') - new Date(d.inicio + 'T12:00')) / 864e5) + 1;
  const [lacA, lacB] = d.sem_medicao || [];
  const naLacuna = lacA && d.inicio <= lacB && d.fim >= lacA;
  const lacunaAnt = lacA && d.anterior && d.anterior.inicio <= lacB && d.anterior.fim >= lacA;   // sem seta de agendaram quando um dos períodos não foi medido

  // Destaque: custo por paciente agendado (06/10/2026, Jorge: o tráfego vai até o agendamento)
  let destaque;
  if (M.ag) destaque = `<div class="rot">Custo por paciente agendado</div><div class="val">${brl0(div(M.gasto, M.ag))}</div>
      <p>Cada pessoa que chegou por anúncio e agendou custou, em média, <b>${brl(div(M.gasto, M.ag))}</b>. Foram <b>${int(M.ag)}</b> ${M.ag === 1 ? 'agendamento' : 'agendamentos'} para <b>${brl0(M.gasto)}</b> investidos${M.parcial ? ' nos dias em que a origem foi medida' : ''}.</p>`;
  else destaque = `<div class="rot">Custo por paciente agendado</div><div class="val">—</div>
      <p>${ag ? 'Os agendamentos deste período caíram em dias sem medição de origem, então não dá para dividir o investimento por eles.' : 'Neste período ninguém que veio de anúncio agendou ainda.'}</p>`;
  if (naLacuna) destaque += `<p>Entre ${br(lacA)} e ${br(lacB)} a origem dos pacientes não foi medida (fim do Tintim, antes da medição própria): o investimento desses dias fica fora do custo por agendamento.</p>`;

  // Agendamentos e atendimentos do período por origem (data do evento, todas as origens)
  const G = geralOrigem(d.geral?.atual), GA = geralOrigem(d.geral?.anterior);
  // Resumo em palavras
  const custoContato = div(gasto, contatos);
  const resumo = gasto ? `Em ${dias} dia${dias > 1 ? 's' : ''} você investiu <b>${brl0(gasto)}</b> e recebeu <b>${int(contatos)} contatos</b>${custoContato ? ` (um a cada ${brl(custoContato)})` : ''}.
    ${pagos.length ? `Das <b>${int(pagos.length)}</b> conversas com origem de anúncio${soma(pagos, 'prov') ? ` (${int(soma(pagos, 'prov'))} ${soma(pagos, 'prov') === 1 ? 'provável, ligada' : 'prováveis, ligadas'} pelo tempo entre o clique e a conversa)` : ''}, <b>${int(ag)}</b> ${ag === 1 ? 'agendou' : 'agendaram'}.` : ''}
    ${orgConv.length ? `Sem anúncio, o orgânico trouxe mais <b>${int(orgConv.length)}</b> ${orgConv.length === 1 ? 'conversa' : 'conversas'} com origem marcada: <b>${int(orgAg)}</b> ${orgAg === 1 ? 'agendou' : 'agendaram'}.` : ''}
    ${(k.pessoas || {}).pessoas ? `No Kommo, contando todas as origens, <b>${int(k.pessoas.pessoas)} pessoas</b> procuraram a clínica (${int(k.pessoas.novas)} pela primeira vez) e <b>${int(k.pessoas.agendaram)}</b> agendaram (${pct(div(k.pessoas.agendaram, k.pessoas.pessoas))}).` : ''}
    ${G.ag.total ? `A maior parte dos agendamentos chega <b>sem origem marcada</b> (${int(G.ag.sem)} de ${int(G.ag.total)}): quem já tem o número, paciente antigo, indicação.` : ''}`
    : 'Não houve investimento em anúncios neste período.';

  $('conteudo').innerHTML = `
  <div class="wrap" style="padding:0">
    <section class="resumo">${resumo}${d.anterior ? `<div class="sub">As setas comparam com ${d.anterior.tipo === 'mes' ? 'o mesmo trecho do mês anterior' : 'o período anterior de mesmo tamanho'}, de ${br(d.anterior.inicio)} a ${br(d.anterior.fim)}. Sem seta: o período anterior não tinha esse dado medido.</div>` : ''}</section>

    <section class="destaque">
      <div>${destaque}</div>
      <div class="plats">${porPlat.map(x => `<div class="plat"><em style="color:var(--${x.p})">${NOME_P[x.p]}</em><span>${int(x.total)} ${x.total === 1 ? 'agendado' : 'agendados'}</span><b>${x.c ? brl0(x.g / x.c) : '—'}</b>${
        !x.c && x.g ? `<small class="plat-nota">${x.p === 'meta' ? 'Medido por inteiro só desde 25/09 (antes, só pelo link do site): ' : 'Nos dias medidos: '}nenhum agendamento ainda.</small>`
        : x.c && x.c < x.total ? `<small class="plat-nota">custo com os ${int(x.c)} agendados dos dias medidos</small>` : ''}</div>`).join('')}</div>
    </section>


    ${secaoMetricas({ ads, adsA, pagos, pagosA, gasto, gastoA, contatos, contatosA, ag, agA, cp, cpA, M, MA, dias, naLacuna: naLacuna || lacunaAnt || !cobre('origem'), num, d })}

    <section class="grupo"><div class="cab"><h2>Todas as origens</h2><span class="sub fino">anúncio, orgânico e quem chega sem origem marcada · não muda com os filtros</span></div><div class="nums">
      ${num('Pessoas que procuraram', int((k.pessoas || {}).pessoas), int(k.entraram) + ' leads no Kommo (a mesma pessoa pode abrir mais de um)', cobre('pessoas') ? delta((k.pessoas || {}).pessoas, (d.kommo_pessoas_ant || {}).pessoas, false, int) : '')}
      ${num('Pessoas novas', int((k.pessoas || {}).novas), 'primeiro contato com a clínica no período' + (d.inicio < (d.cobertura || {}).pessoas ? ' · confiável desde 14/09' : ''), cobre('pessoas') ? delta((k.pessoas || {}).novas, (d.kommo_pessoas_ant || {}).novas, false, int) : '')}
      ${num('Agendaram', int((k.pessoas || {}).agendaram), 'pessoas que foram para Agendado no Kommo', cobre('pessoas') ? delta((k.pessoas || {}).agendaram, (d.kommo_pessoas_ant || {}).agendaram, false, int) : '')}
      ${num('Taxa de agendamento', pct(div((k.pessoas || {}).agendaram, (k.pessoas || {}).pessoas)), 'pessoas que agendaram ÷ pessoas que procuraram', cobre('pessoas') ? delta(div((k.pessoas || {}).agendaram, (k.pessoas || {}).pessoas), div((d.kommo_pessoas_ant || {}).agendaram, (d.kommo_pessoas_ant || {}).pessoas), false, pct) : '')}
    </div>
    ${blocoOrigens(G, GA)}</section>

    ${d.mes ? blocoMes(d.mes, d.guardiao) : ''}

    <section class="grupo"><div class="cab"><h2>Dia a dia</h2><span class="sub fino">toque na legenda para esconder ou mostrar cada série</span></div><div class="duas">
      <section class="bloco"><h3>Investimento</h3><div class="sub fino">por dia, Google e Meta</div><div class="grafico"><canvas id="g-gasto"></canvas></div></section>
      <section class="bloco"><h3>Contatos e leads</h3><div class="sub fino">contatos dos anúncios (Google e Meta) e leads no Kommo de todas as origens</div><div class="grafico"><canvas id="g-contatos"></canvas></div></section>
    </div></section>

    <section class="bloco"><div class="cab"><h2>Quando os leads chegam</h2><span class="sub fino">leads novos no Kommo por dia da semana e hora · todas as origens</span></div>${mapaHoras(d.horas)}</section>

    <section class="bloco lista"><div class="cab"><h2>Campanhas</h2><div class="opcoes"><button class="link" data-abre="camp" aria-expanded="${!!(E.abre || {}).camp}">${(E.abre || {}).camp ? 'Esconder' : 'Mostrar'}</button></div></div>
      <div id="corpo-camp" ${(E.abre || {}).camp ? '' : 'hidden'}><div class="opcoes" style="margin-bottom:8px"><button class="link" id="ver-detalhes">${E.detalhes ? 'Esconder exibições e cliques' : 'Mostrar exibições e cliques'}</button></div>
      <div class="rolagem ${E.detalhes ? 'mostra-detalhe' : ''}"><table id="t-camp"></table></div><div class="cartoes" id="c-camp"></div><div id="mais-camp"></div></div></section>

    <section class="bloco lista"><div class="cab"><h2>Anúncios</h2><div class="opcoes"><button class="link" data-abre="ad" aria-expanded="${!!(E.abre || {}).ad}">${(E.abre || {}).ad ? 'Esconder' : 'Mostrar'}</button></div></div>
      <div id="corpo-ad" ${(E.abre || {}).ad ? '' : 'hidden'}><div class="sub fino">toque no nome do anúncio do Meta para ver o post</div>
      <div class="rolagem ${E.detalhes ? 'mostra-detalhe' : ''}"><table id="t-ad"></table></div><div class="cartoes" id="c-ad"></div><div id="mais-ad"></div></div></section>

    <details class="como"><summary>Como os números são calculados</summary><ul>
      <li>Investimento, contatos e dados de cada anúncio vêm do Google Ads e do Meta, na hora em que a página abre.</li>
      <li>Agendaram e atendidos contam quem chegou com a origem de um anúncio marcada (mensagem pronta do anúncio, clique no site ou, desde 05/10/2026, o carimbo que a Meta põe na mensagem de quem veio de anúncio de WhatsApp, mesmo sem o texto pronto), ligados ao Kommo e ao iGut até 60 dias depois da conversa. ${esc(d.medicao || '')}</li>
      <li>Receita (30 d) = valor cobrado no iGut dos atendimentos de cada paciente com origem marcada, até 30 dias depois do primeiro contato. Valor do paciente (LTV) = o mesmo em 180 dias, dividido pelos pacientes com receita. No histórico do App Health (2.186 pacientes novos de fev a ago/2025, sem protocolo), 30 dias pegam 63% da receita do primeiro ano, 90 dias 75% e 180 dias 85%; metade do primeiro contato ao atendimento leva até 1 dia e 80% até 6 dias (fora faltas e desmarcados; produção copiada todo dia às 3h20${d.receita_desde ? `; dados do iGut desde ${br(d.receita_desde)}` : ''}). "Novo" = sem atendimento registrado antes do contato (histórico desde 25/07/2026). Retorno = receita ÷ investimento.</li>
      <li>Origem "provável" (desde 05/10/2026): clique no WhatsApp do site sem texto reconhecido, ligado à única conversa nova dos 5 minutos seguintes, quando não há outro clique perto (regra que acertou 38 de 38 nos casos conhecidos). Conta no painel; não vai para o Google.</li>
      <li>Custo por agendamento e por paciente atendido = investimento ÷ resultado, contando só os dias em que a origem foi medida (medição própria desde 25/09/2026; no Tintim, até 23/08, só Google e link do site). O investimento de 24/08 a 24/09 fica de fora desses custos. Os atendimentos dos últimos dias ainda podem crescer.</li>
      <li>Contatos = conversas iniciadas no Meta + cliques no WhatsApp vindos do Google + ligações vindas do Google.</li>

  if (freqMsg != null && dias >= 7 && soma(alcMsg, 'alcance') >= 1000) { if (freqMsg > 3) li('atencao', `<b>Frequência ${freqMsg.toFixed(1).replace('.', ',')}</b> nas campanhas de mensagem do Meta: as mesmas pessoas viram o anúncio mais de 3 vezes no período. Hora de trocar o criativo ou ampliar o público.`); }
  if (perdOrc != null && perdOrc > .3) li('atencao', `O Google <b>deixa de aparecer em ${pct(perdOrc)} das buscas por falta de verba</b>: há demanda sobrando na campanha.`);
  if (perdPos != null && perdPos > .4) li('atencao', `O Google perde <b>${pct(perdPos)} das buscas por posição ou qualidade</b>: anúncio e página precisam melhorar (índice de qualidade), ou o lance está baixo.`);
  // Contato → agendou por canal (07/10/2026, Jorge: a leitura tem que ser assertiva). O atendimento (Nexa e recepção) é o mesmo
  // para todos os canais: só aponta o atendimento se todos marcam pouco; se um canal marca bem menos que os outros, o problema
  // é o contato que aquele anúncio traz. Canal com menos de 20 conversas no período não entra na conclusão.
  { const NOMEC = { google: 'Google', meta: 'Meta' }, outros = (d.origens || []).filter(o => o.conv && o.p !== 'outros');
    const tx = l => ({ n: l.length, ag: l.filter(o => o.ag).length, tx: l.length ? l.filter(o => o.ag).length / l.length : null });
    let todosBaixos = false;

      if (t.n < 20) { if (t.n >= 5 && t.tx < .15) li('atencao', `No ${NOMEC[p]}, ${int(t.ag)} de ${int(t.n)} conversas marcaram consulta: ainda são poucas conversas para apontar a causa.`); continue; }
      if (t.tx < .15 && r.n >= 20 && r.tx >= .2 && r.tx >= t.tx * 1.8) li('ruim', `No ${NOMEC[p]}, <b>só ${pp} de cada 100 conversas marcam consulta</b>, contra ${rp} nos outros canais, que passam pelo mesmo atendimento: o problema está no contato que esse anúncio traz (público ou promessa do anúncio), não no atendimento.`);
      else if (t.tx < .15 && r.n >= 20 && r.tx < .15) todosBaixos = true;
      else if (t.tx >= .3) li('bom', `No ${NOMEC[p]}, ${pp} de cada 100 conversas marcam consulta.`);
    }
    if (todosBaixos) { const g = tx(outros); li('ruim', `Todos os canais marcam pouco (${Math.round(g.tx * 100)} de cada 100 conversas): como o problema é comum a todos, o gargalo está no atendimento.`); } }
  if (!L.length) li('bom', 'Nada fora do esperado nas métricas deste período.');

  const et = (n, t, sub, cards) => `<div class="et-linha"><div class="et-rot"><span class="et-n">${n}</span><div><b>${t}</b><span>${sub}</span></div></div><div class="nums">${cards}</div></div>`;
  const CM = compMedida(), semSeta = CM ? null : '', dm = s => rotMedido(s, CM);
  return `<section class="grupo"><div class="cab"><h2>Métricas de tráfego</h2><span class="sub fino">a jornada do anúncio até a consulta: quantos passam em cada etapa, a taxa e o custo</span></div>
    <div class="etapas-traf">

      const m = d.mes, pl = E.plataforma === 'google' || E.plataforma === 'meta' ? (m?.plataformas || []).find(x => x.p === E.plataforma) : null;
      const t = E.campanha || !m ? null : pl ? { gasto: pl.gasto, teto: pl.teto, proj: pl.projecao } : { gasto: m.gasto, teto: m.teto, proj: m.projecao };
      const nomeMes = m ? MESES[Number(m.inicio.slice(5, 7)) - 1] : '', fechou = m && m.dia === m.dias;
      const selo = !t || !t.teto ? '' : t.proj > t.teto * 1.02 ? `<span class="delta ruim">${fechou ? 'passou' : 'vai passar'} do teto</span>` : `<span class="delta bom">${fechou ? 'dentro' : 'no ritmo'} do teto</span>`;
      return et(1, 'Investiram', 'quanto foi para os anúncios', `

      ${num('Por dia', brl0(gasto / dias), `média de ${int(dias)} ${dias === 1 ? 'dia' : 'dias'}`, delta(gasto / dias, gastoA / dias, false, brl0, true))}
      ${num('Do teto do mês', t && t.teto ? pct(t.gasto / t.teto) : '—', t && t.teto ? `${brl0(t.gasto)} de ${brl0(t.teto)} em ${nomeMes}` + (fechou ? '' : ` · no ritmo, fecha em ${brl0(t.proj)}`) : 'escolha todas as campanhas para ver o teto', selo)}`); })()}
    ${et(2, 'Viram o anúncio', 'exposição', `
      ${num('Exibições', int(impr), 'vezes que o anúncio apareceu', delta(impr, imprA, false, int, true))}
      ${!verMeta ? '' : (() => { // Saturação do criativo (07/10/2026, Jorge): frequência das campanhas de mensagem do Meta, sem remarketing (que repete de
        // propósito). Mesma régua do guardião e da troca de criativos: até 3 ok, acima de 3 cansando, acima de 4 em 7 dias = trocar.
        if (freqMsg == null) return num('Saturação do criativo (Meta)', '—', 'frequência das campanhas de mensagem', '');
        const f = freqMsg.toFixed(1).replace('.', ','), semana = dias <= 10;
        const selo = !semana ? '' : freqMsg > 4 ? '<span class="delta ruim">saturado: trocar o criativo</span>' : freqMsg > 3 ? '<span class="delta igual">começando a cansar</span>' : '<span class="delta bom">ok</span>';

      ${!verGoogle ? '' : num('Parcela de impressões (Google)', parcela != null ? pct(parcela) : '—', parcela != null ? `das buscas possíveis · perde ${pct(perdOrc)} por verba e ${pct(perdPos)} por posição` : 'só campanhas de busca', '')}
      ${num('CPM', brl(cpm), 'custo por mil exibições', delta(cpm, cpmA, true, brl))}`)}
    ${et(3, 'Clicaram', 'interesse', `
      ${num('Cliques', int(cliques), 'no anúncio', delta(cliques, cliquesA, false, int, true))}
      ${num('CTR', pct(ctr), 'cliques ÷ exibições', delta(ctr, ctrA, false, pct))}
      ${num('CPC', brl(cpc), 'custo por clique', delta(cpc, cpcA, true, brl))}`)}
    ${et(4, 'Chamaram', 'WhatsApp ou ligação', `
      ${num('Contatos', int(contatos), 'conversas, cliques no WhatsApp e ligações', delta(contatos, contatosA, false, int))}
      ${num('Clique → contato', pct(txC), 'contatos ÷ cliques', delta(txC, txCA, false, pct))}
      ${num('Custo por contato (CPL)', brl(cpl), 'investimento ÷ contatos', delta(cpl, cplA, true, brl))}`)}
    ${et(5, 'Agendaram', 'conversas de anúncio que marcaram', `
      ${num('Agendaram', int(ag), 'com origem de anúncio marcada', semSeta ?? dm(delta(M.ag, MA.ag * CM.f, false, v => int(Math.round(v)))))}
      ${num('Contato → agendou', pagos.length ? pct(txAg) : '—', 'agendaram ÷ conversas de anúncio', semSeta ?? dm(delta(div(M.ag, M.pagos.length), div(MA.ag, MA.pagos.length), false, pct)))}
      ${num('Custo por agendamento', M.ag ? brl(cpAg) : '—', !M.ag && ag ? 'nenhum agendamento nos dias com medição completa' : 'investimento ÷ agendaram' + soMedidos, semSeta ?? dm(delta(cpAg, cpAgA, true, brl)))}`)}
    ${(() => { const tk = d.ticket_medio;
      const maior30 = Math.max(0, ...pagosR.map(o => Number(o.rec) || 0)), conc30 = rec && pacs > 1 && maior30 / rec > 0.5 ? ` · 1 paciente responde por ${pct(maior30 / rec)}` : '';
      // Faturamento dos agendamentos (07/10/2026, Jorge): começa como 100% de comparecimento e vai consolidando. Atendido = valor
      // real no iGut (30 dias depois do contato); ainda não atendido = ticket médio sem protocolo; 30 dias sem atendimento = fora.

        for (const o of l.filter(o => o.ag)) { if (o.cp && o.pac) { r.real += Number(o.rec) || 0; r.nReal++; } else if (o.d < lim30) r.perd++; else { r.pend += tk; r.nPend++; } }
        r.total = r.real + r.pend; return r; };

      const fat = F ? F.total : null, fatA = FA ? FA.total : null, roas = fat && M.gasto ? fat / M.gasto : null, roasA = fatA && MA.gasto ? fatA / MA.gasto : null;

    </div>

// Mapa de calor: dia da semana × hora (6h a 22h). Quanto mais escuro, mais leads chegaram naquela hora.
function mapaHoras(h) {
  if (!h || !h.total) return '<div class="sub">Ainda não há leads por hora neste período (a contagem por hora começou em 28/09/2026, com histórico de 90 dias).</div>';
  const DIAS = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'], H0 = 6, H1 = 22, horas = []; for (let x = H0; x <= H1; x++) horas.push(x);
  const g = h.grade, max = Math.max(1, ...g.flat()); let fora = 0;
  g.forEach(l => l.forEach((v, hh) => { if (hh < H0 || hh > H1) fora += v; }));
  const melhor = g.map((l, i) => ({ i, t: l.reduce((s, v) => s + v, 0) })).sort((a, b) => b.t - a.t)[0];
  const porHora = horas.map(hh => g.reduce((s, l) => s + l[hh], 0)); const pico = horas[porHora.indexOf(Math.max(...porHora))];
  const cel = (v) => { const p = v / max; return `<td class="cal" style="--p:${p.toFixed(2)};color:${p > .55 ? '#fff' : 'var(--strong)'}" title="${int(v)} lead${v === 1 ? '' : 's'}">${v ? int(v) : ''}</td>`; };
  return `<div class="rolagem"><table class="calor"><thead><tr><th></th>${horas.map(x => `<th>${x}h</th>`).join('')}</tr></thead><tbody>` +
    g.map((l, i) => `<tr><th class="txt">${DIAS[i]}</th>${horas.map(hh => cel(l[hh])).join('')}</tr>`).join('') + '</tbody></table></div>' +
    `<div class="sub">Dia mais movimentado: <b>${DIAS[melhor.i]}</b> · hora de pico: <b>${pico}h</b> · ${int(h.total)} leads no período${fora ? ` (${int(fora)} fora de 6h a 22h)` : ''}.</div>`;
}

// Mês contra o teto (Google + Meta, sem filtro), no mês em que o período termina, e o guardião nos 3 últimos dias do período
function blocoMes(m, g) {
  const nomeMes = MESES[Number(m.inicio.slice(5, 7)) - 1];
  const pGasto = m.teto ? Math.min(1, m.gasto / m.teto) : 0, pDia = m.dia / m.dias;
  const passou = m.teto && m.projecao > m.teto * 1.02, fechou = m.dia === m.dias;
  const VERBO = { pausar: ['Pausou', 'Pausaria'], orcamento: ['Mudou o orçamento', 'Mudaria o orçamento'] };
  const acoes = (g?.acoes || []).map(a => {
    const falhou = String(a.resultado || '').startsWith('falhou');
    const txt = a.resultado === 'aviso' ? `⚠️ ${a.alvo ? esc(a.alvo) + ': ' : ''}${esc(a.detalhe)}`
      : falhou ? `Não conseguiu ${a.acao === 'pausar' ? 'pausar' : 'mudar'} ${esc(a.alvo)}: ${esc(String(a.resultado).slice(8))}`
      : `<b>${(VERBO[a.acao] || [a.acao, a.acao])[a.modo === 'real' ? 0 : 1]}</b> · ${esc(a.alvo)} · ${esc(a.detalhe)}`;
    return `<div class="acao ${a.resultado === 'aviso' ? 'aviso-g' : falhou ? 'falha' : ''}"><span class="q">${brCurto(a.data)}</span><span>${txt}</span></div>`; }).join('');
  // Teto por plataforma desde 29/09/2026 (R$ 1.400 Google + R$ 1.400 Meta); sem a divisão, mostra o teto somado
  const umaBarra = (nome, cor, gasto, teto, proj) => { const pg = teto ? Math.min(1, gasto / teto) : 0, acima = teto && proj > teto * 1.02;
    return `<div class="teto-p"><div class="cab"><b style="color:var(${cor})">${nome}</b><span><b class="num-f">${brl0(gasto)}</b> de ${brl0(teto)}</span></div>
      <div class="barra-mes"><b style="width:${(pg * 100).toFixed(1)}%;background:var(${cor})"></b><i style="left:${(pDia * 100).toFixed(1)}%" title="onde o mês está"></i></div>
      <div class="sub fino">${Math.round(pg * 100)}% do teto · ${fechou ? 'fechou em' : 'no ritmo ' + (m.hoje ? 'atual' : 'até ' + brCurto(m.fim)) + ' fecha em'} <b style="color:var(--${acima ? 'ruim' : 'bom'})">${brl0(proj)}</b>${acima ? ', acima do teto' : ''}</div></div>`; };
  const ps = m.plataformas || [];
  return `<section class="bloco"><div class="cab"><h2>${nomeMes[0].toUpperCase() + nomeMes.slice(1)} contra o teto</h2><span class="sub fino">sem filtro · ${m.hoje || fechou ? '' : 'até ' + brCurto(m.fim) + ' · '}${m.hoje ? '' : 'teto de hoje · '}${ps.length ? ps.map(x => NOME_P[x.p] + ' ' + brl0(x.teto)).join(' + ') + ' por mês' : 'Google + Meta, teto ' + brl0(m.teto) + ' por mês'}</span></div>
    <div class="mes">
      <div>
        <div class="grande">${brl0(m.gasto)} <small>de ${brl0(m.teto)}</small></div>
        <div class="sub">Dia ${m.dia} de ${m.dias} (${Math.round(pDia * 100)}% do mês) · ${Math.round(pGasto * 100)}% do teto gasto.
          ${fechou ? 'O mês fechou em' : 'No ritmo ' + (m.hoje ? 'atual' : 'até ' + brCurto(m.fim)) + ' o mês fecha em'} <b style="color:var(--${passou ? 'ruim' : 'bom'})">${brl0(m.projecao)}</b>${passou ? ', acima do teto' : ''}.</div>
        ${ps.length ? ps.map(x => umaBarra(NOME_P[x.p], '--' + x.p, x.gasto, x.teto, x.projecao)).join('') : `<div class="barra-mes"><b style="width:${(pGasto * 100).toFixed(1)}%"></b><i style="left:${(pDia * 100).toFixed(1)}%"></i></div>`}
      </div>
      <div>
        <div class="cab" style="margin-bottom:8px"><h3 style="font-size:16px">Guardião · ${m.hoje ? 'últimos 3 dias' : '3 dias até ' + brCurto(m.fim)}</h3><span class="selo ${g?.modo === 'real' ? 'real' : ''}">${g?.modo === 'real' ? 'ligado' : 'simulação'}</span></div>
        <div class="acoes">${acoes || '<div class="sub">Nada a corrigir nesses 3 dias. Ele roda todo dia às 7h30 e conta no relatório das 8h.</div>'}</div>
        ${g?.modo !== 'real' ? '<div class="sub fino" style="margin-top:8px"><b>Em simulação:</b> ele avisa e mostra o que faria (pausar conjunto sem contato, cortar orçamento perto do teto), mas não mexe em nada nos anúncios.</div>' : ''}
      </div>
    </div></section>`;
}

function avisos(ads) {
  const m = {};
  for (const a of ads) { const k = a.p + '|' + a.camp; (m[k] ||= { p: a.p, camp: a.camp, gasto: 0, contatos: 0 }); m[k].gasto += a.gasto; m[k].contatos += a.contatos; }
  const l = Object.values(m).filter(c => c.gasto >= 30 && c.contatos === 0 && !/alcance|reconhecimento|rmkt/i.test(c.camp));
  $('avisos').innerHTML = (E.dados.avisos || []).map(t => `<div class="aviso ruim">${esc(t)}</div>`).join('') +
    l.map(c => `<div class="aviso">A campanha <b>${esc(c.camp)}</b> (${NOME_P[c.p]}) gastou ${brl(c.gasto)} no período e não trouxe nenhum contato.</div>`).join('');
}

function desenhaGrafico(ads) {
  const dias = []; for (let x = new Date(E.dados.inicio + 'T12:00'); x <= new Date(E.dados.fim + 'T12:00'); x.setDate(x.getDate() + 1)) dias.push(iso(x));

  const kd = Object.fromEntries(((E.dados.kommo || {}).dias || []).map(x => [x.d, x]));
  const txt = cor('--muted'), grid = cor('--line'), celular = innerWidth < 720, labels = dias.map(brCurto);
  graficos.forEach(g => g.destroy()); graficos = [];
  const base = (dinheiro) => ({ responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
    plugins: { legend: { position: 'bottom', labels: { color: txt, boxWidth: 12, padding: 10, font: { family: 'Inter', size: 12 } } },
      tooltip: { callbacks: { label: c => c.dataset.label + ': ' + (dinheiro ? brl(c.parsed.y) : int(c.parsed.y)) } } },

      y: { stacked: true, ticks: { color: txt, precision: 0, callback: v => dinheiro ? 'R$ ' + v : v, maxTicksLimit: 5, font: { size: 11 } }, grid: { color: grid }, beginAtZero: true } } });
  const plat = (k) => [E.plataforma !== 'meta' && { type: 'bar', label: 'Google', data: serie('google', k), backgroundColor: cor('--google'), stack: 's', borderRadius: 3 },
    E.plataforma !== 'google' && { type: 'bar', label: 'Meta', data: serie('meta', k), backgroundColor: cor('--meta'), stack: 's', borderRadius: 3 }].filter(Boolean);
  graficos.push(new Chart($('g-gasto'), { data: { labels, datasets: plat('gasto') }, options: base(true) }));
  // Contatos dos anúncios (empilhados) ao lado dos leads do Kommo (outra pilha); a legenda liga e desliga cada série
  const contatos = plat(['contatos', 'ligacoes']).map(d => ({ ...d, label: 'Contatos ' + d.label }));
  graficos.push(new Chart($('g-contatos'), { data: { labels, datasets: [...contatos,
    { type: 'bar', label: 'Leads no Kommo', data: dias.map(dd => kd[dd]?.entraram || 0), backgroundColor: cor('--lima'), stack: 'k', borderRadius: 3 },
    { type: 'line', label: 'Agendaram no Kommo', data: dias.map(dd => kd[dd]?.agendados || 0), borderColor: cor('--alerta'), backgroundColor: cor('--alerta'), tension: .3, pointRadius: 2 },
    ...(((E.dados.igut_marcados || {}).dias || []).length ? [{ type: 'line', label: 'Marcaram no iGut (horário novo)', data: dias.map(dd => (Object.fromEntries(E.dados.igut_marcados.dias.map(x => [x.d, x.novo])))[dd] ?? null), borderColor: cor('--google'), backgroundColor: cor('--google'), borderDash: [5, 4], tension: .3, pointRadius: 2, spanGaps: false, hidden: true }] : [])] }, options: base(false) }));
}

// Barras por origem: conversas, agendaram e atendidos (as 8 origens com mais conversas)
function desenhaGraficoUtm(linhas) {
  if (graficoUtm) { graficoUtm.destroy(); graficoUtm = null; }
  const caixa = $('g-utm').parentElement;
  if (!linhas.length) { caixa.style.display = 'none'; return; }
  caixa.style.display = ''; caixa.style.height = (40 + linhas.length * (innerWidth < 720 ? 46 : 40)) + 'px';
  const txt = cor('--muted'), grid = cor('--line'), celular = innerWidth < 720;
  const rotulo = n => celular && n.length > 22 ? n.slice(0, 21) + '…' : n;
  graficoUtm = new Chart($('g-utm'), { type: 'bar', data: { labels: linhas.map(r => rotulo(r.nome)), datasets: [
      { label: 'Conversas', data: linhas.map(r => r.conv), backgroundColor: cor('--google'), borderRadius: 4 },
      { label: 'Agendaram', data: linhas.map(r => r.ag), backgroundColor: cor('--lima'), borderRadius: 4 }] },
    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { position: 'bottom', labels: { color: txt, boxWidth: 12, padding: 12, font: { family: 'Inter', size: celular ? 12 : 13 } } },
        tooltip: { callbacks: { title: it => linhas[it[0].dataIndex].nome } } },
      scales: { x: { ticks: { color: txt, precision: 0, font: { size: 12 } }, grid: { color: grid }, beginAtZero: true },
        y: { ticks: { color: txt, font: { size: celular ? 12 : 13 }, autoSkip: false }, grid: { display: false } } } } });
}

function agrupa(ads, pagos, chave, info) {
  // gastoMed e agMed: custo por agendamento de cada linha só com os dias em que a origem foi medida (mesma regra do topo)
  const ok = medicao([], []).ok;
  const m = {}, novo = o => ({ ...info(o), gasto: 0, gastoMed: 0, impr: 0, cliques: 0, contatos: 0, ligacoes: 0, atend_plat: 0, plat_ag: 0, plat_cp: 0, ag: 0, agMed: 0, cp: 0, cpMed: 0, rec: 0, pacs: 0, novos: 0 });
  for (const a of ads) { const k = chave(a); m[k] ||= novo(a); for (const c of ['gasto', 'impr', 'cliques', 'contatos', 'ligacoes', 'atend_plat', 'plat_ag', 'plat_cp']) m[k][c] += Number(a[c]) || 0; if (ok(a)) m[k].gastoMed += Number(a.gasto) || 0; }
  for (const o of pagos) { const k = chave(o); m[k] ||= novo(o); if (o.ag) { m[k].ag++; if (ok(o)) m[k].agMed++; } if (o.cp) { m[k].cp++; if (ok(o)) m[k].cpMed++; } m[k].rec += Number(o.rec) || 0; if ((Number(o.rec) || 0) > 0) { m[k].pacs++; if (o.novo) m[k].novos++; } }
  return Object.values(m);
}

function lista(id, linhas, porAnuncio) {
  const cols = [
    ['nome', porAnuncio ? 'Anúncio' : 'Campanha', r => `<span class="tag ${r.p}">${NOME_P[r.p]}</span>${r.link ? `<a href="${r.link}" target="_blank" rel="noopener">${esc(r.nome)}</a>` : esc(r.nome)}${r.onde ? `<div class="sub fino">${esc(r.onde)}</div>` : ''}`, 'txt'],
    ['gasto', 'Investimento', r => brl(r.gasto)], ['impr', 'Exibições', r => int(r.impr), 'detalhe'], ['cliques', 'Cliques', r => int(r.cliques), 'detalhe'],
    ['ctr', 'CTR', r => pct(div(r.cliques, r.impr)), 'detalhe'],
    ['contatos', 'Contatos', r => int(r.contatos + r.ligacoes) + (r.ligacoes ? ` <span class="nulo">(${int(r.ligacoes)} lig.)</span>` : '')],
    ['cpc', 'Custo por contato', r => r.p === 'organico' ? '<span class="nulo">—</span>' : brl(div(r.gasto, r.contatos + r.ligacoes))], ['ag', 'Agendaram', r => int(r.ag)],   // coluna Atendidos saiu em 06/10/2026 (tráfego vai até o agendamento)
    ['cpa', 'Custo por agendamento', r => r.p === 'organico' ? '<span class="nulo">sem custo</span>' : brl(div(r.gastoMed, r.agMed)), 'forte'],
    ['rec', 'Receita (30 d)', r => r.rec ? brl(r.rec) + (r.pacs ? ` <span class="nulo">${int(r.novos)} ${r.novos === 1 ? 'novo' : 'novos'}</span>` : '') : '<span class="nulo">—</span>'],
    ['roi', 'Retorno', r => r.p === 'organico' ? '<span class="nulo">sem custo</span>' : (r.gastoMed && r.rec) ? (r.rec / r.gastoMed).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '×' : '<span class="nulo">—</span>', 'forte'],
    ['atend_plat', 'Conversões que a plataforma atribui', r => r.p === 'meta' ? `${int(r.atend_plat)} <span class="nulo">confirm./atend.</span>` : r.p === 'google' ? `${int(r.plat_ag)} <span class="nulo">agend.</span> · ${int(r.plat_cp)} <span class="nulo">atend.</span>` : '<span class="nulo">—</span>', 'detalhe'],
  ];
  const calc = { ctr: r => div(r.cliques, r.impr) ?? -1, contatos: r => r.contatos + r.ligacoes, cpc: r => div(r.gasto, r.contatos + r.ligacoes) ?? 1e12, cpa: r => div(r.gastoMed, r.agMed) ?? 1e12, rec: r => r.rec, roi: r => div(r.rec, r.gastoMed) ?? -1, atend_plat: r => r.atend_plat + r.plat_ag + r.plat_cp, nome: r => String(r.nome) };
  const o = ORDEM[id] ||= { k: 'gasto', dir: -1 };
  const val = r => calc[o.k] ? calc[o.k](r) : r[o.k];
  linhas.sort((a, b) => (val(a) > val(b) ? 1 : val(a) < val(b) ? -1 : 0) * o.dir);
  const corte = linhas.slice(0, LIMITE[id]); const mostrar = E.todos[id] ? linhas : corte.concat(linhas.slice(LIMITE[id]).filter(r => r.p === 'organico'));   // orgânico nunca fica escondido
  $('t-' + id).innerHTML = '<thead><tr>' + cols.map(([k, n, , cls]) => `<th class="${cls || ''}" data-k="${k}">${n}${o.k === k ? (o.dir < 0 ? ' ↓' : ' ↑') : ''}</th>`).join('') + '</tr></thead><tbody>' +
    (mostrar.length ? mostrar.map(r => '<tr>' + cols.map(([, , f, cls]) => `<td class="${cls || ''}">${f(r)}</td>`).join('') + '</tr>').join('') : `<tr><td class="txt" colspan="${cols.length}">Nada neste período.</td></tr>`) + '</tbody>';
  $('t-' + id).querySelectorAll('th').forEach(th => th.onclick = () => { const k = th.dataset.k; ORDEM[id] = { k, dir: o.k === k ? -o.dir : -1 }; desenhar(); });
  $('c-' + id).innerHTML = mostrar.length ? mostrar.map(r => `<div class="cartao"><div class="nome"><span class="tag ${r.p}">${NOME_P[r.p]}</span>${r.link ? `<a href="${r.link}" target="_blank" rel="noopener">${esc(r.nome)}</a>` : esc(r.nome)}</div>${r.onde ? `<div class="onde">${esc(r.onde)}</div>` : ''}
    <div class="met"><div><span>Investimento</span><b>${brl0(r.gasto)}</b></div><div><span>Contatos</span><b>${int(r.contatos + r.ligacoes)}</b></div>
    <div><span>Agendaram</span><b>${int(r.ag)}</b></div>
    <div class="forte"><span>Custo por agendamento</span><b>${r.p === 'organico' ? 'sem custo' : r.agMed ? brl0(r.gastoMed / r.agMed) : '—'}</b></div>
    <div><span>Receita (30 d)</span><b>${r.rec ? brl0(r.rec) : '—'}</b></div><div><span>Retorno</span><b>${r.p === 'organico' ? 'sem custo' : (r.gastoMed && r.rec) ? (r.rec / r.gastoMed).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '×' : '—'}</b></div></div></div>`).join('')
    : '<div class="sub">Nada neste período.</div>';
  mais(id, linhas.length, porAnuncio ? 'todos os anúncios' : 'todas as campanhas');
}

function listaUtm(ori) {
  const chave = E.utm === 'pagina' ? (o => o.pag || (o.tintim ? 'site antigo (Tintim)' : 'fora do site')) : (o => o.fonte + ' / ' + (o.meio || '—') + (o.camp_utm ? ' · ' + o.camp_utm : ''));
  const m = {};
  for (const o of ori) { const k = chave(o); (m[k] ||= { nome: k, cliques: 0, conv: 0, ag: 0, cp: 0, rec: 0 }); if (o.clique) m[k].cliques++; if (o.conv) { m[k].conv++; m[k].ag += o.ag; m[k].cp += o.cp; m[k].rec += Number(o.rec) || 0; } }
  const porConv = Object.values(m).sort((a, b) => b.conv - a.conv || b.cliques - a.cliques);
  desenhaGraficoUtm(porConv.filter(r => r.conv).slice(0, 8));
  // Toque no título da coluna ordena (de novo inverte), como nas outras tabelas
  const o = ORDEM.utm ||= { k: 'conv', dir: -1 };
  const val = { nome: r => r.nome.toLowerCase(), taxa: r => div(r.ag, r.conv) ?? -1 }[o.k] || (r => r[o.k]);
  const todas = porConv.slice().sort((a, b) => (val(a) > val(b) ? 1 : val(a) < val(b) ? -1 : 0) * o.dir || b.conv - a.conv);
  const l = E.todos.utm ? todas : todas.slice(0, LIMITE.utm);
  mais('utm', todas.length, 'todas as origens');
  const cab = [['nome', E.utm === 'pagina' ? 'Página' : 'Origem / meio', 'txt'], ['cliques', 'Cliques no WhatsApp do site'], ['conv', 'Conversas'], ['ag', 'Agendaram'], ['taxa', 'Agendaram ÷ conversas'], ['rec', 'Receita (30 d)']];
  $('t-utm').innerHTML = `<thead><tr>${cab.map(([k, n, cls]) => `<th class="${cls || ''}" data-k="${k}">${n}${o.k === k ? (o.dir < 0 ? ' ↓' : ' ↑') : ''}</th>`).join('')}</tr></thead><tbody>` +
    (l.length ? l.map(r => `<tr><td class="txt">${esc(r.nome)}</td><td>${r.cliques ? int(r.cliques) : '<span class="nulo">—</span>'}</td><td>${int(r.conv)}</td><td>${int(r.ag)}</td><td class="forte">${pct(div(r.ag, r.conv))}</td><td>${r.rec ? brl(r.rec) : '<span class="nulo">—</span>'}</td></tr>`).join('')
      : '<tr><td class="txt" colspan="6">Não há leads com origem marcada neste período.</td></tr>') + '</tbody>';
  $('t-utm').querySelectorAll('th').forEach(th => th.onclick = () => { const k = th.dataset.k; ORDEM.utm = { k, dir: o.k === k ? -o.dir : (k === 'nome' ? 1 : -1) }; desenhar(); });
  $('c-utm').innerHTML = l.length ? l.map(r => `<div class="cartao"><div class="nome">${esc(r.nome)}</div><div class="met">
    <div><span>Conversas</span><b>${int(r.conv)}</b></div><div><span>Agendaram</span><b>${int(r.ag)}</b></div>
    <div class="forte"><span>Agendaram ÷ conversas</span><b>${pct(div(r.ag, r.conv))}</b></div></div></div>`).join('')
    : '<div class="sub">Não há leads com origem marcada neste período.</div>';
}

document.querySelectorAll('#atalhos .chip').forEach(c => c.onclick = () => periodo(c.dataset.p));
$('aplicar').onclick = recarregar;
$('conta').onchange = () => { E.conta = $('conta').value; recarregar(); };
$('campanha').onchange = () => { E.campanha = $('campanha').value; desenhar(); };
document.querySelectorAll('#plataforma button').forEach(b => b.onclick = () => {
  E.plataforma = b.dataset.v; document.querySelectorAll('#plataforma button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  E.campanha = ''; $('campanha').value = ''; desenhar(); });
iniciar();
</script>
